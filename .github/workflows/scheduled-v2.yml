name: Scheduled tests (v2 production)

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests against v2.virtualflybrain.org
        run: npx playwright test
        env:
          VFB_BASE_URL: https://v2.virtualflybrain.org/

      - name: Generate Markdown summary
        if: always()
        run: |
          node scripts/generate-summary.js test-results/results.json test-results/summary.md
          # Render the summary on the workflow run page
          cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"
        env:
          VFB_BASE_URL: https://v2.virtualflybrain.org/

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-v2
          path: playwright-report/
          # Heavy artifact (HTML + screenshots) — keep for 14 days only.
          # The latest report is always available at github.io/<repo>/v2/ too.
          retention-days: 14

      - name: Upload Markdown summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-summary-v2
          path: test-results/summary.md
          retention-days: 30

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: v2
