name: Manual tests (any server)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test (e.g. https://v2-dev.virtualflybrain.org/)'
        required: true
        default: 'https://v2-dev.virtualflybrain.org/'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests against ${{ github.event.inputs.base_url }}
        run: npx playwright test
        env:
          VFB_BASE_URL: ${{ github.event.inputs.base_url }}

      - name: Flag site outage
        if: always() && hashFiles('test-results/site-outage.json') != ''
        run: |
          msg=$(jq -r '"Site went down at \(.since) (detected after \(.detectedAfter)), so the rest of the run was skipped. Re-run this workflow once the site is back up. \(.problems | join("; "))"' test-results/site-outage.json)
          echo "::error title=Site outage - tests skipped::${msg}"

      - name: Generate Markdown summary
        if: always()
        run: |
          node scripts/generate-summary.js test-results/results.json test-results/summary.md
          # Render the summary on the workflow run page
          cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"
        env:
          VFB_BASE_URL: ${{ github.event.inputs.base_url }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          # Heavy artifact (HTML + screenshots) — keep for 14 days only
          retention-days: 14

      - name: Upload Markdown summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-summary
          path: test-results/summary.md
          retention-days: 30
